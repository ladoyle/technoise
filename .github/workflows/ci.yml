name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v5
      - name: Set up the Node version pinned in .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from the lockfile
        run: npm ci
      - name: Type and template diagnostics
        run: npx astro check
      - name: Test suite
        run: npm test
